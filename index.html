/* =========================================================
   rate
   ========================================================= */
function formatRate(value) {
    const numeric = Number(value);
    if (!Number.isFinite(numeric)) {
        return '1.0';
    }
    return numeric.toFixed(2).replace(/(\.\d)0$/, '$1');
}

function setRate(value, persist = true, silent = false) {
    const numeric = Math.min(2, Math.max(0.5, Number(value) || 1));
    currentRate = numeric;

    if (rateInput.value !== String(numeric)) {
        rateInput.value = String(numeric);
    }
    if (popoverRateInput.value !== String(numeric)) {
        popoverRateInput.value = String(numeric);
    }

    const display = formatRate(numeric);
    rateValue.textContent = display;
    rateInput.setAttribute('aria-valuetext', display);
    popoverRateInput.setAttribute('aria-valuetext', display);
    popoverRateValue.textContent = `${display}x`;
    if (moreRateValue) {
        moreRateValue.textContent = `${display}x`;
    }
    if (speedBtn) {
        speedBtn.textContent = `${display}x`;
    }
    sidebarRate.textContent = `${display}x`;

    setRangeFill(rateInput, (numeric - 0.5) / 1.5);
    setRangeFill(popoverRateInput, (numeric - 0.5) / 1.5);

    speedPresets.querySelectorAll('[data-rate]').forEach(chip => {
        chip.classList.toggle('is-active', Math.abs(Number(chip.dataset.rate) - numeric) < 0.001);
    });

    if (persist && !silent) {
        scheduleUserStateSave();
    }
}

function setRangeFill(element, ratio) {
    if (!element) {
        return;
    }
    const clamped = Math.min(1, Math.max(0, Number(ratio) || 0));
    element.style.setProperty('--range-progress', `${(clamped * 100).toFixed(2)}%`);
}

/* =========================================================
   voices
   ========================================================= */
function getVoiceKey(voice) {
    return voice.voiceURI || `${voice.name}::${voice.lang}`;
}

function getSelectedVoice() {
    if (!preferredVoiceURI) {
        return null;
    }
    return voices.find(voice => getVoiceKey(voice) === preferredVoiceURI) || null;
}

function getVoiceDisplayName() {
    const voice = getSelectedVoice();
    if (!voice) {
        return getTranslation('noVoicesAvailable');
    }
    const shortName = voice.name.split(' - ')[0].split('(')[0].trim();
    return shortName.length > 18 ? `${shortName.slice(0, 17)}…` : shortName;
}

function getVoiceLanguageLabel(lang) {
    try {
        if (typeof Intl !== 'undefined' && typeof Intl.DisplayNames === 'function') {
            const display = new Intl.DisplayNames([document.documentElement.lang || 'en'], { type: 'language' });
            const label = display.of(lang);
            if (label) {
                return label;
            }
        }
    } catch (error) { /* ignore */ }
    return lang;
}

function loadVoices() {
    voices = synth.getVoices();
    voiceSelect.innerHTML = '';

    const preferredLanguage = languageSelect.value || String(navigator.language || 'en').split('-')[0];
    const sortedVoices = voices.slice().sort((a, b) => {
        return a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name);
    });

    if (sortedVoices.length > 0) {
        let preferredVoiceIndex = sortedVoices.findIndex(voice => getVoiceKey(voice) === preferredVoiceURI);

        if (preferredVoiceIndex === -1) {
            preferredVoiceIndex = sortedVoices.findIndex(voice => voice.lang.startsWith(preferredLanguage));
        }
        if (preferredVoiceIndex === -1) {
            preferredVoiceIndex = 0;
        }

        sortedVoices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.value = getVoiceKey(voice);
            option.selected = index === preferredVoiceIndex;
            voiceSelect.appendChild(option);
        });

        preferredVoiceURI = getVoiceKey(sortedVoices[preferredVoiceIndex]);
        voiceSelect.value = preferredVoiceURI;
    } else {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = getTranslation('noVoicesAvailable');
        voiceSelect.appendChild(option);
    }

    renderVoiceList();
    updatePlayerUI();
}

function initVoices() {
    loadVoices();
    if (voices.length === 0 && typeof synth.addEventListener === 'function') {
        synth.addEventListener('voiceschanged', loadVoices);
    } else {
        synth.onvoiceschanged = loadVoices;
    }
}

function setVoice(key) {
    preferredVoiceURI = key || '';
    if (voiceSelect.value !== preferredVoiceURI && preferredVoiceURI) {
        voiceSelect.value = preferredVoiceURI;
    }
    renderVoiceList();
    updatePlayerUI();
    scheduleUserStateSave();
}

function renderVoiceList() {
    if (!voiceList) {
        return;
    }

    const query = String(voiceSearch.value || '').trim().toLowerCase();
    voiceList.innerHTML = '';

    const matching = voices
        .filter(voice => {
            if (!query) {
                return true;
            }
            return `${voice.name} ${voice.lang}`.toLowerCase().includes(query);
        })
        .sort((a, b) => a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name));

    if (matching.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'option-empty';
        empty.textContent = voices.length === 0
            ? getTranslation('loadingVoices')
            : getTranslation('noVoicesFound');
        voiceList.appendChild(empty);
        return;
    }

    const groups = new Map();
    matching.forEach(voice => {
        if (!groups.has(voice.lang)) {
            groups.set(voice.lang, []);
        }
        groups.get(voice.lang).push(voice);
    });

    groups.forEach((groupVoices, lang) => {
        const label = document.createElement('div');
        label.className = 'option-group-label';
        label.textContent = `${lang} · ${getVoiceLanguageLabel(lang.split('-')[0])}`;
        voiceList.appendChild(label);

        groupVoices.forEach(voice => {
            const key = getVoiceKey(voice);
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'option-item';
            button.dataset.voiceKey = key;
            button.setAttribute('role', 'option');
            const isSelected = key === preferredVoiceURI;
            button.classList.toggle('is-selected', isSelected);
            button.setAttribute('aria-selected', String(isSelected));

            const main = document.createElement('span');
            main.className = 'option-main';

            const name = document.createElement('span');
            name.className = 'option-name';
            name.textContent = voice.name;

            const sub = document.createElement('span');
            sub.className = 'option-sub';
            sub.textContent = `${voice.lang}${voice.localService ? ' · local' : ''}`;

            main.append(name, sub);

            const check = document.createElement('i');
            check.className = 'fa fa-check option-check';
            check.setAttribute('aria-hidden', 'true');

            button.append(main, check);
            voiceList.appendChild(button);
        });
    });
}

/* =========================================================
   language list
   ========================================================= */
function buildLanguageOptions() {
    languageSelect.innerHTML = '';
    Object.keys(languages).forEach(code => {
        const option = document.createElement('option');
        option.value = code;
        option.textContent = `${flagEmojis[code] || ''} ${languages[code]}`;
        languageSelect.appendChild(option);
    });
}

function renderLanguageList() {
    if (!languageList) {
        return;
    }

    languageList.innerHTML = '';
    const current = languageSelect.value;

    Object.keys(languages).forEach(code => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option-item';
        button.dataset.language = code;
        button.setAttribute('role', 'option');
        const isSelected = code === current;
        button.classList.toggle('is-selected', isSelected);
        button.setAttribute('aria-selected', String(isSelected));

        const flag = document.createElement('span');
        flag.textContent = flagEmojis[code] || '🌐';
        flag.style.fontSize = '15px';
        flag.setAttribute('aria-hidden', 'true');

        const main = document.createElement('span');
        main.className = 'option-main';
        const name = document.createElement('span');
        name.className = 'option-name';
        name.textContent = languages[code];
        main.appendChild(name);

        const check = document.createElement('i');
        check.className = 'fa fa-check option-check';
        check.setAttribute('aria-hidden', 'true');

        button.append(flag, main, check);
        languageList.appendChild(button);
    });
}

function setLanguage(code) {
    if (!code || !languages[code]) {
        return;
    }
    languageSelect.value = code;
    renderLanguageList();
    loadTranslations(code);
    scheduleUserStateSave();
}

/* =========================================================
   sentences / output
   ========================================================= */
function splitIntoSentences(text) {
    if (typeof Intl !== 'undefined' && typeof Intl.Segmenter === 'function') {
        try {
            const segmenter = new Intl.Segmenter(undefined, { granularity: 'sentence' });
            return Array.from(segmenter.segment(text), item => item.segment);
        } catch (error) {
            console.warn('Sentence segmenter failed, using fallback:', error);
        }
    }

    const sentenceRegex = /(?<!\w\.\w.)(?<![A-Z][a-z]\.)(?<![A-Z]\.)(?<=[。！？\.?!；;])(?:\s|\n|$)/g;
    return text.split(sentenceRegex);
}

function createSentenceElement(sentenceText, isPending = false) {
    const row = document.createElement('p');
    row.className = 'sentence-row';
    if (isPending) {
        row.classList.add('is-pending');
        row.style.opacity = '0';
        row.style.transform = 'translateY(10px)';
    }

    const eq = document.createElement('span');
    eq.className = 'sentence-eq';
    eq.setAttribute('aria-hidden', 'true');
    eq.innerHTML = '<i></i><i></i><i></i>';

    const speakButton = document.createElement('button');
    speakButton.type = 'button';
    speakButton.className = 'sentence-speak-btn';
    speakButton.dataset.i18nTitle = 'startReadingButton';
    speakButton.dataset.i18nAriaLabel = 'startReadingButton';
    speakButton.title = getTranslation('startReadingButton');
    speakButton.setAttribute('aria-label', getTranslation('startReadingButton'));
    speakButton.innerHTML = '<i class="fa fa-volume-up" aria-hidden="true"></i>';

    const sentenceTextElement = document.createElement('span');
    sentenceTextElement.className = 'sentence-text';
    sentenceTextElement.textContent = sentenceText;
    sentenceTextElement.prepend(eq);
    sentenceTextElement.prepend(speakButton);

    row.appendChild(sentenceTextElement);
    return row;
}

function updateSentences() {
    sentences = Array.from(lyricsTrack.querySelectorAll('.sentence-row'));
    lastStyledIndex = -1;
}

function appendToOutput(text) {
    text = String(text || '');
    text = text.replace(/^[\s\u3000]+|[\s\u3000]+$/g, '');
    text = text.replace(/\n{2,}/g, '\n');

    const newSentences = splitIntoSentences(text)
        .map(sentence => sentence.replace(/^[\s\u3000]+|[\s\u3000]+$/g, ''))
        .filter(Boolean);

    if (newSentences.length === 0) {
        return;
    }

    newSentences.forEach(sentence => pendingOutputSentences.push(sentence));
    processPendingOutputSentences();
}

function processPendingOutputSentences() {
    if (isAppendingOutput || pendingOutputSentences.length === 0) {
        return;
    }

    isAppendingOutput = true;
    const generation = outputImportGeneration;
    const startingFromEmpty = sentences.length === 0;

    function appendBatch() {
        if (generation !== outputImportGeneration) {
            isAppendingOutput = false;
            return;
        }

        const batch = pendingOutputSentences.splice(0, outputBatchSize);
        const fragment = document.createDocumentFragment();
        const batchRows = [];

        batch.forEach(sentence => {
            const row = createSentenceElement(sentence, true);
            fragment.appendChild(row);
            batchRows.push(row);
        });

        lyricsTrack.appendChild(fragment);
        requestAnimationFrame(() => {
            batchRows.forEach(row => {
                row.classList.remove('is-pending');
                row.style.opacity = '';
                row.style.transform = '';
            });
        });

        updateSentences();
        renderEmptyState();
        resetBtn.disabled = false;

        if (startingFromEmpty && !hasPlaybackPosition) {
            currentSentenceIndex = 0;
            updateSentenceStyles();
            centerCurrentSentence(false, true);
        } else {
            updateSentenceStyles();
        }

        updatePlayerUI();

        if (pendingOutputSentences.length > 0) {
            setTimeout(appendBatch, 0);
        } else {
            isAppendingOutput = false;
            scheduleUserStateSave();
        }
    }

    appendBatch();
}

function renderEmptyState() {
    const isEmpty = sentences.length === 0;
    lyricsEmpty.hidden = !isEmpty;
    lyricsViewport.setAttribute('aria-hidden', String(isEmpty));
    lyricsCount.textContent = String(sentences.length);
}

/* =========================================================
   lyrics geometry + highlighting
   ========================================================= */
function getActiveIndex() {
    if (sentences.length === 0) {
        return -1;
    }
    if (previewIndex !== null && previewIndex >= 0 && previewIndex < sentences.length) {
        return previewIndex;
    }
    return Math.max(0, Math.min(currentSentenceIndex, sentences.length - 1));
}

function getDisplayedNumber() {
    if (sentences.length === 0) {
        return 0;
    }
    if (previewIndex !== null && previewIndex >= 0 && previewIndex < sentences.length) {
        return Math.min(previewIndex + 1, sentences.length);
    }
    if (!hasPlaybackPosition) {
        return 0;
    }
    return Math.min(currentSentenceIndex + 1, sentences.length);
}

function getTranslateForIndex(index) {
    const row = sentences[index];
    if (!row) {
        return 0;
    }
    const viewportHeight = lyricsViewport.clientHeight || 0;
    return viewportHeight / 2 - (row.offsetTop + row.offsetHeight / 2);
}

function getTranslateBounds() {
    if (sentences.length === 0) {
        return { min: 0, max: 0 };
    }
    return {
        min: getTranslateForIndex(sentences.length - 1),
        max: getTranslateForIndex(0)
    };
}

function centerCurrentSentence(smooth = true, force = false) {
    if (!autoScrollToggle.checked && !force) {
        return;
    }

    if (lyricsViewport.clientHeight < 10) {
        return;
    }

    const active = getActiveIndex();
    const target = active >= 0 ? getTranslateForIndex(active) : 0;
    trackTranslate = target;

    lyricsTrack.classList.toggle('no-anim', !smooth);
    lyricsTrack.style.transform = `translateY(${target}px)`;
}

function updateSentenceStyles() {
    const active = getActiveIndex();
    const touched = new Set();

    if (lastStyledIndex >= 0) {
        touched.add(lastStyledIndex - 1);
        touched.add(lastStyledIndex);
        touched.add(lastStyledIndex + 1);
    }
    if (active >= 0) {
        touched.add(active - 1);
        touched.add(active);
        touched.add(active + 1);
    }

    touched.forEach(index => {
        const row = sentences[index];
        if (!row) {
            return;
        }
        const distance = Math.abs(index - active);
        const isCurrent = index === active;
        row.classList.toggle('is-current', isCurrent);
        row.classList.toggle('is-near', !isCurrent && distance === 1);
        if (isCurrent) {
            row.setAttribute('aria-current', 'true');
        } else {
            row.removeAttribute('aria-current');
        }
    });

    lastStyledIndex = active;
}

/* =========================================================
   player UI
   ========================================================= */
function getTrackTitle() {
    if (sentences.length === 0) {
        return getTranslation('noContentTitle');
    }
    const firstText = sentences[0].querySelector('.sentence-text');
    const text = (firstText ? firstText.textContent : '').trim();
    if (!text) {
        return getTranslation('noContentTitle');
    }
    return text.length > 20 ? `${text.slice(0, 20)}…` : text;
}

function updatePlayerUI() {
    const total = sentences.length;
    const active = getActiveIndex();
    const displayed = getDisplayedNumber();
    const isPlaying = playbackState === 'playing';

    playerTitle.textContent = getTrackTitle();

    readingProgressValue.textContent = t('currentSentenceShort', { current: displayed, total });
    progressCurrent.textContent = String(displayed);
    progressTotal.textContent = String(total);

    progressRange.max = String(Math.max(0, total - 1));
    progressRange.value = String(active < 0 ? 0 : active);
    progressRange.disabled = total === 0 || playbackState === 'idle';
    setRangeFill(progressRange, total > 1 && active >= 0 ? active / (total - 1) : 0);

    playerBar.classList.toggle('is-playing', isPlaying);
    playerBar.classList.toggle('is-idle', playbackState === 'idle');
    playerCover.classList.toggle('is-spinning', isPlaying);

    const playIcon = playPauseBtn.querySelector('i');
    if (playIcon) {
        playIcon.className = `fa ${isPlaying ? 'fa-pause' : 'fa-play'}`;
    }
    playPauseBtn.classList.toggle('is-playing', isPlaying);
    const playLabel = getTranslation(isPlaying ? 'pauseReadingButton' : 'startReadingButton');
    playPauseBtn.setAttribute('aria-label', playLabel);
    playPauseBtn.title = playLabel;

    stopBtn.disabled = playbackState === 'idle';
    prevSentencesBtn.disabled = total === 0;
    nextSentencesBtn.disabled = total === 0;

    sidebarVoice.textContent = getVoiceDisplayName();
    lyricsCount.textContent = String(total);

    if (speedPresets.querySelectorAll('[data-rate]').length === 0) {
        buildSpeedPresets();
    }
    speedPresets.querySelectorAll('[data-rate]').forEach(chip => {
        chip.classList.toggle('is-active', Math.abs(Number(chip.dataset.rate) - currentRate) < 0.001);
    });
    sidebarRate.textContent = `${formatRate(currentRate)}x`;

    if (currentView === 'read') {
        topbarTitle.textContent = getTrackTitle();
        topbarEyebrow.textContent = getTranslation('nowPlaying');
        topbarEyebrow.dataset.i18n = 'nowPlaying';
    }
}

function buildSpeedPresets() {
    speedPresets.innerHTML = '';
    speedPresetsList.forEach(value => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.dataset.rate = String(value);
        chip.textContent = `${formatRate(value)}x`;
        chip.setAttribute('aria-pressed', 'false');
        chip.addEventListener('click', () => {
            setRate(value);
            updatePlayerUI();
        });
        speedPresets.appendChild(chip);
    });
}

function updateTopBar() {
    const map = {
        read: 'nowPlaying',
        settings: 'navSettings'
    };
    topbarEyebrow.textContent = getTranslation(map[currentView] || 'nowPlaying');
    topbarEyebrow.dataset.i18n = map[currentView] || 'nowPlaying';

    if (currentView === 'read') {
        topbarTitle.textContent = getTrackTitle();
    } else {
        topbarTitle.textContent = getTranslation('readingControlsTitle');
    }
}

/* =========================================================
   playback
   ========================================================= */
function speakCurrentSentence() {
    if (playbackState !== 'playing') {
        return;
    }

    if (currentSentenceIndex >= sentences.length) {
        finishReading();
        return;
    }

    const sentenceIndex = currentSentenceIndex;
    const textElement = sentences[sentenceIndex]?.querySelector('.sentence-text');
    const sentenceText = textElement ? textElement.textContent.trim() : '';

    if (!sentenceText) {
        currentSentenceIndex += 1;
        speakCurrentSentence();
        return;
    }

    const session = speechSessionId;
    const utterance = new SpeechSynthesisUtterance(sentenceText);
    const selectedVoice = getSelectedVoice();

    if (selectedVoice) {
        utterance.voice = selectedVoice;
        utterance.lang = selectedVoice.lang;
    } else {
        utterance.lang = document.documentElement.lang || navigator.language;
    }

    utterance.rate = currentRate;
    speechUtterance = utterance;
    hasPlaybackPosition = true;

    updateSentenceStyles();
    centerCurrentSentence(true);
    updatePlayerUI();

    utterance.onend = () => {
        const isCurrentSession = session === speechSessionId && utterance === speechUtterance;
        if (!isCurrentSession || playbackState !== 'playing' || currentSentenceIndex !== sentenceIndex) {
            return;
        }

        speechUtterance = null;
        currentSentenceIndex += 1;
        hasPlaybackPosition = true;

        if (currentSentenceIndex >= sentences.length) {
            finishReading();
            return;
        }

        updateSentenceStyles();
        centerCurrentSentence(true);
        updatePlayerUI();
        scheduleUserStateSave();
        speakCurrentSentence();
    };

    utterance.onerror = (event) => {
        const isCurrentSession = session === speechSessionId && utterance === speechUtterance;
        if (!isCurrentSession || ['canceled', 'interrupted'].includes(event.error)) {
            return;
        }

        console.error('Speech synthesis error:', event);
        speechUtterance = null;
        playbackState = 'idle';
        updateSentenceStyles();
        updatePlayerUI();
        scheduleUserStateSave();
        showNotification(getTranslation('speechErrorNotification'), 'error');
    };

    synth.speak(utterance);
}

function finishReading() {
    speechSessionId += 1;
    playbackState = 'idle';
    speechUtterance = null;
    currentSentenceIndex = sentences.length;
    hasPlaybackPosition = sentences.length > 0;

    updateSentenceStyles();
    centerCurrentSentence(true);
    updatePlayerUI();
    scheduleUserStateSave();
    showNotification(getTranslation('readingCompleteNotification'));
}

function seekToSentence(index, shouldPlay = true) {
    if (!Number.isInteger(index) || !sentences[index]) {
        return;
    }

    speechSessionId += 1;

    if (speechUtterance || synth.speaking || synth.paused) {
        synth.cancel();
    }

    speechUtterance = null;
    currentSentenceIndex = index;
    playbackState = shouldPlay ? 'playing' : 'paused';
    hasPlaybackPosition = true;

    updateSentenceStyles();
    centerCurrentSentence(true, true);
    updatePlayerUI();
    scheduleUserStateSave();

    if (playbackState === 'playing') {
        speakCurrentSentence();
    }
}

function seekBySentenceOffset(offset) {
    if (sentences.length === 0) {
        return;
    }

    const referenceIndex = hasPlaybackPosition ? getActiveIndex() : 0;
    const targetIndex = Math.max(0, Math.min(sentences.length - 1, referenceIndex + offset));
    seekToSentence(targetIndex, playbackState === 'playing');
}

function togglePlayback() {
    if (sentences.length === 0) {
        showNotification(getTranslation('noContentToReadError'), 'error');
        return;
    }

    if (playbackState === 'playing') {
        synth.pause();
        playbackState = 'paused';
        updatePlayerUI();
        scheduleUserStateSave();
        showNotification(getTranslation('readingPausedNotification'));
        return;
    }

    if (playbackState === 'paused') {
        const hasPausedUtterance = speechUtterance && synth.paused;
        playbackState = 'playing';
        hasPlaybackPosition = true;

        if (hasPausedUtterance) {
            synth.resume();
        } else {
            if (currentSentenceIndex >= sentences.length) {
                currentSentenceIndex = 0;
            }
            speakCurrentSentence();
        }

        updateSentenceStyles();
        updatePlayerUI();
        scheduleUserStateSave();
        return;
    }

    if (currentSentenceIndex >= sentences.length) {
        currentSentenceIndex = 0;
    }

    speechSessionId += 1;
    playbackState = 'playing';
    hasPlaybackPosition = true;
    updateSentenceStyles();
    updatePlayerUI();
    speakCurrentSentence();
    scheduleUserStateSave();
}

function stopReading(shouldNotify = true) {
    speechSessionId += 1;

    if (speechUtterance || playbackState !== 'idle') {
        synth.cancel();
    }

    speechUtterance = null;
    playbackState = 'idle';
    currentSentenceIndex = 0;
    hasPlaybackPosition = false;

    updateSentenceStyles();
    centerCurrentSentence(true, true);
    updatePlayerUI();
    scheduleUserStateSave();

    if (shouldNotify) {
        showNotification(getTranslation('readingStoppedNotification'));
    }
}

/* =========================================================
   restore
   ========================================================= */
function restoreOutputState() {
    const storedSentences = savedUserState.outputSentences
        .map(sentence => sentence.trim())
        .filter(Boolean);

    lyricsTrack.innerHTML = '';
    sentences = [];
    currentSentenceIndex = 0;
    hasPlaybackPosition = false;
    lastStyledIndex = -1;
    resetBtn.disabled = true;

    if (storedSentences.length > 0) {
        const fragment = document.createDocumentFragment();
        storedSentences.forEach(sentenceText => {
            fragment.appendChild(createSentenceElement(sentenceText));
        });
        lyricsTrack.appendChild(fragment);

        updateSentences();
        currentSentenceIndex = Math.min(savedUserState.currentSentenceIndex, sentences.length);
        hasPlaybackPosition = savedUserState.hasPlaybackPosition;
        resetBtn.disabled = false;
    }

    renderEmptyState();
    updateSentenceStyles();
    centerCurrentSentence(false, true);
    updatePlayerUI();
}

/* =========================================================
   notifications
   ========================================================= */
const activeNotificationSlots = new Set();

function showNotification(message, type = 'success', action = null, duration = 3000) {
    const notification = document.createElement('div');
    notification.className = `notification${type === 'error' ? ' is-error' : ''}`;
    notification.setAttribute('role', type === 'error' ? 'alert' : 'status');
    notification.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');

    // Stack multiple toasts instead of letting them overlap.
    let slot = 0;
    while (activeNotificationSlots.has(slot)) {
        slot += 1;
    }
    activeNotificationSlots.add(slot);
    notification.style.bottom = `calc(var(--player-h) + 18px + ${slot * 62}px)`;

    const text = document.createElement('span');
    text.textContent = message;
    notification.appendChild(text);

    const removeNotification = () => {
        activeNotificationSlots.delete(slot);
        if (notification.isConnected) {
            document.body.removeChild(notification);
        }
    };

    if (action) {
        const actionButton = document.createElement('button');
        actionButton.type = 'button';
        actionButton.textContent = action.label;
        actionButton.addEventListener('click', () => {
            action.onAction();
            removeNotification();
        });
        notification.appendChild(actionButton);
    }

    document.body.appendChild(notification);

    setTimeout(() => {
        notification.classList.add('notification-visible');
    }, 10);

    setTimeout(() => {
        notification.classList.remove('notification-visible');
        setTimeout(removeNotification, 320);
    }, duration);
}

/* =========================================================
   popovers
   ========================================================= */
function positionPopover(popover, trigger) {
    const margin = 10;
    const gap = 12;
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;

    popover.style.left = '0px';
    popover.style.top = '0px';

    const width = popover.offsetWidth;
    const height = popover.offsetHeight;

    const isNarrow = viewportWidth <= 767;
    const playerTop = playerBar ? playerBar.getBoundingClientRect().top : viewportHeight;

    let left = viewportWidth - width - 16;
    let top = Math.min(playerTop, viewportHeight) - height - gap;

    if (trigger) {
        const rect = trigger.getBoundingClientRect();
        const isRtl = document.documentElement.dir === 'rtl';
        left = isNarrow ? (viewportWidth - width) / 2 : (isRtl ? rect.left : rect.right - width);
        top = rect.top - height - gap;

        if (top < margin) {
            top = Math.min(viewportHeight - height - margin, rect.bottom + gap);
        }
    }

    // Keep popovers clear of the player bar so they never cover the transport controls.
    const playerLimit = playerTop - gap;
    if (playerLimit - height >= margin) {
        top = Math.min(top, playerLimit - height);
    }

    left = Math.max(margin, Math.min(left, viewportWidth - width - margin));
    top = Math.max(margin, top);

    popover.style.transformOrigin = trigger && top >= (trigger.getBoundingClientRect().bottom - 4) ? 'top' : 'bottom';
    popover.style.left = `${Math.round(left)}px`;
    popover.style.top = `${Math.round(top)}px`;
}

function openPopover(popoverOrId, trigger) {
    const popover = typeof popoverOrId === 'string'
        ? document.getElementById(popoverOrId)
        : popoverOrId;

    if (!popover) {
        return;
    }

    if (activePopover === popover) {
        closeAllPopovers(true);
        return;
    }

    if (activePopoverTrigger) {
        activePopoverTrigger.setAttribute('aria-expanded', 'false');
    }

    document.querySelectorAll('.popover').forEach(item => {
        if (item !== popover) {
            item.hidden = true;
        }
    });
    document.querySelectorAll('[data-popover-trigger]').forEach(button => {
        if (!trigger || button !== trigger) {
            button.setAttribute('aria-expanded', 'false');
        }
    });

    popover.hidden = false;
    activePopover = popover;
    activePopoverTrigger = trigger || document.querySelector(`[data-popover-trigger="${popover.id}"]`) || null;

    if (activePopoverTrigger) {
        activePopoverTrigger.setAttribute('aria-expanded', 'true');
    }

    positionPopover(popover, activePopoverTrigger);

    requestAnimationFrame(() => {
        let focusTarget = null;
        if (popover.id === 'voice-popover') {
            focusTarget = voiceSearch;
            const selected = voiceList.querySelector('.option-item.is-selected');
            if (selected) {
                const offset = selected.offsetTop - voiceList.offsetTop;
                voiceList.scrollTop = Math.max(0, offset - voiceList.clientHeight / 2);
            }
        } else if (popover.id === 'speed-popover') {
            focusTarget = popoverRateInput;
        } else {
            focusTarget = popover.querySelector('.option-item.is-selected')
                || popover.querySelector('.option-item')
                || popover.querySelector('button');
        }
        if (focusTarget && focusTarget.isConnected) {
            focusTarget.focus({ preventScroll: true });
        }
    });
}

function closeAllPopovers(returnFocus = false) {
    const trigger = activePopoverTrigger;

    document.querySelectorAll('.popover').forEach(popover => {
        popover.hidden = true;
    });
    document.querySelectorAll('[data-popover-trigger]').forEach(button => {
        button.setAttribute('aria-expanded', 'false');
    });

    activePopover = null;
    activePopoverTrigger = null;

    if (returnFocus && trigger && trigger.isConnected) {
        trigger.focus({ preventScroll: true });
    }
}

/* =========================================================
   lyric drag to seek
   ========================================================= */
function getCurrentTranslateY() {
    const transform = window.getComputedStyle(lyricsTrack).transform;
    if (transform && transform !== 'none') {
        const match = transform.match(/matrix(3d)?\(([^)]+)\)/);
        if (match) {
            const values = match[2].split(',').map(Number);
            if (values.length === 6) {
                return values[5];
            }
            if (values.length === 16) {
                return values[13];
            }
        }
    }
    return trackTranslate;
}

function findClosestRowIndex(centerInTrack) {
    if (sentences.length === 0) {
        return -1;
    }

    let low = 0;
    let high = sentences.length - 1;

    while (low < high) {
        const mid = (low + high) >> 1;
        const row = sentences[mid];
        const center = row.offsetTop + row.offsetHeight / 2;
        if (center < centerInTrack) {
            low = mid + 1;
        } else {
            high = mid;
        }
    }

    const previous = Math.max(0, low - 1);
    const current = sentences[low];
    const adjacent = sentences[previous];
    const currentDistance = Math.abs(current.offsetTop + current.offsetHeight / 2 - centerInTrack);
    const adjacentDistance = Math.abs(adjacent.offsetTop + adjacent.offsetHeight / 2 - centerInTrack);

    return currentDistance <= adjacentDistance ? low : previous;
}

function updateDragTooltip(index, x, y) {
    dragTooltipText.textContent = `${t('jumpToSentence', { n: index + 1 })} · ${t('totalSentences', { total: sentences.length })}`;
    dragTooltip.style.left = `${x}px`;
    dragTooltip.style.top = `${y}px`;
    dragTooltip.hidden = false;
}

function handleDragMove() {
    dragRafId = 0;

    if (!dragState || !dragPoint) {
        return;
    }

    const dy = dragPoint.y - dragState.startY;

    if (!dragState.moved) {
        if (Math.abs(dy) < 6 && Math.abs(dragPoint.x - dragState.startX) < 6) {
            return;
        }
        dragState.moved = true;
        lyricsViewport.classList.add('is-dragging');
        lyricsTrack.classList.add('no-anim');

        try {
            lyricsViewport.setPointerCapture(dragState.pointerId);
            dragState.captured = true;
        } catch (error) { /* ignore */ }
    }

    const bounds = getTranslateBounds();
    const nextTranslate = Math.max(bounds.min, Math.min(bounds.max, dragState.startTranslate + dy));

    trackTranslate = nextTranslate;
    lyricsTrack.style.transform = `translateY(${nextTranslate}px)`;

    const centerInTrack = (lyricsViewport.clientHeight / 2) - nextTranslate;
    const targetIndex = findClosestRowIndex(centerInTrack);

    if (targetIndex !== tooltipSentenceIndex && targetIndex >= 0) {
        tooltipSentenceIndex = targetIndex;
        previewIndex = targetIndex;
        updateSentenceStyles();
        updatePlayerUI();
    }

    if (targetIndex >= 0) {
        updateDragTooltip(targetIndex, dragPoint.x, dragPoint.y);
    }
}

function onLyricsPointerDown(event) {
    if (isFileDragActive) {
        return;
    }
    if (event.pointerType === 'mouse' && event.button !== 0) {
        return;
    }
    if (event.target.closest('.sentence-speak-btn') || event.target.closest('#lyrics-empty')) {
        return;
    }
    if (sentences.length === 0) {
        return;
    }

    dragState = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        startTranslate: getCurrentTranslateY(),
        moved: false,
        captured: false,
        wasPlaying: playbackState === 'playing'
    };
    dragPoint = { x: event.clientX, y: event.clientY };
    tooltipSentenceIndex = -1;
}

function onLyricsPointerMove(event) {
    if (!dragState) {
        return;
    }

    dragPoint = { x: event.clientX, y: event.clientY };

    if (!dragRafId) {
        dragRafId = requestAnimationFrame(handleDragMove);
    }
}

function endLyricsDrag(commit) {
    if (!dragState) {
        return;
    }

    const wasDragging = dragState.moved;
    const wasPlaying = dragState.wasPlaying;
    const targetIndex = previewIndex;
    const pointerId = dragState.pointerId;
    const wasCaptured = dragState.captured;

    dragState = null;
    dragPoint = null;

    if (dragRafId) {
        cancelAnimationFrame(dragRafId);
        dragRafId = 0;
    }

    lyricsViewport.classList.remove('is-dragging');
    dragTooltip.hidden = true;
    tooltipSentenceIndex = -1;

    if (wasCaptured) {
        try {
            lyricsViewport.releasePointerCapture(pointerId);
        } catch (error) { /* ignore */ }
    }

    if (!wasDragging) {
        previewIndex = null;
        updateSentenceStyles();
        return;
    }

    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 350);

    previewIndex = null;

    if (commit && Number.isInteger(targetIndex) && targetIndex >= 0) {
        seekToSentence(targetIndex, wasPlaying);
    } else {
        updateSentenceStyles();
        centerCurrentSentence(true, true);
    }
}

/* =========================================================
   content actions
   ========================================================= */
function copyReadingContent() {
    if (sentences.length === 0) {
        showNotification(getTranslation('noContentToCopyError'), 'error');
        return;
    }

    const text = getStoredOutputSentences().join('\n');

    const fallbackCopy = () => {
        const helper = document.createElement('textarea');
        helper.value = text;
        helper.setAttribute('readonly', 'readonly');
        helper.style.position = 'fixed';
        helper.style.top = '-1000px';
        helper.style.opacity = '0';
        document.body.appendChild(helper);
        helper.select();
        let succeeded = false;
        try {
            succeeded = document.execCommand('copy');
        } catch (error) {
            succeeded = false;
        }
        document.body.removeChild(helper);

        if (succeeded) {
            showNotification(getTranslation('contentCopiedNotification'));
        } else {
            showNotification(getTranslation('copyFailedError'), 'error');
        }
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
            .then(() => showNotification(getTranslation('contentCopiedNotification')))
            .catch(error => {
                console.error('Copy failed:', error);
                fallbackCopy();
            });
    } else {
        fallbackCopy();
    }
}

function clearReadingContent() {
    const hadContent = sentences.length > 0;
    const previousSentences = getStoredOutputSentences();
    const previousIndex = currentSentenceIndex;
    const previousHasPosition = hasPlaybackPosition;
    const previousFocus = document.activeElement;

    stopReading(false);

    outputImportGeneration += 1;
    pendingOutputSentences.length = 0;
    isAppendingOutput = false;

    lyricsTrack.innerHTML = '';
    lyricsTrack.style.transform = 'translateY(0px)';
    trackTranslate = 0;
    sentences = [];
    currentSentenceIndex = 0;
    hasPlaybackPosition = false;
    lastStyledIndex = -1;

    renderEmptyState();
    updateSentenceStyles();
    updatePlayerUI();
    resetBtn.disabled = true;
    scheduleUserStateSave();

    const undoAction = hadContent ? {
        label: getTranslation('undoClearButton', 'Undo'),
        onAction: () => {
            outputImportGeneration += 1;
            const fragment = document.createDocumentFragment();
            previousSentences.forEach(sentenceText => {
                fragment.appendChild(createSentenceElement(sentenceText));
            });
            lyricsTrack.innerHTML = '';
            lyricsTrack.appendChild(fragment);

            updateSentences();
            currentSentenceIndex = Math.min(previousIndex, sentences.length);
            hasPlaybackPosition = previousHasPosition;

            renderEmptyState();
            updateSentenceStyles();
            centerCurrentSentence(false, true);
            updatePlayerUI();
            resetBtn.disabled = sentences.length === 0;
            scheduleUserStateSave();

            if (previousFocus && previousFocus.isConnected) {
                previousFocus.focus();
            }

            showNotification(getTranslation('contentRestoredNotification'));
        }
    } : null;

    showNotification(
        getTranslation('contentResetNotification'),
        'success',
        undoAction,
        hadContent ? 8000 : 3000
    );
}

/* =========================================================
   replace content (manual input + dropped / picked files)
   ========================================================= */
function replaceContent(rawText, options = {}) {
    const {
        message = getTranslation('textUpdatedNotification'),
        preserveWhitespace = false
    } = options;

    let text = String(rawText || '');
    text = text.replace(/^[\s\u3000]+|[\s\u3000]+$/g, '');

    if (!preserveWhitespace) {
        text = text.replace(/\n{2,}/g, '\n');
    }

    const trimPattern = preserveWhitespace ? /^[ \t\u3000]+|[ \t\u3000]+$/g : /^[\s\u3000]+|[\s\u3000]+$/g;
    const newSentences = splitIntoSentences(text)
        .map(sentence => sentence.replace(trimPattern, ''))
        .filter(Boolean);

    if (newSentences.length === 0) {
        showNotification(getTranslation('emptyInputError'), 'error');
        return false;
    }

    const previousSentences = getStoredOutputSentences();
    const previousIndex = currentSentenceIndex;
    const previousHasPosition = hasPlaybackPosition;

    stopReading(false);

    outputImportGeneration += 1;
    pendingOutputSentences.length = 0;
    isAppendingOutput = false;

    lyricsTrack.innerHTML = '';
    lyricsTrack.style.transform = 'translateY(0px)';
    trackTranslate = 0;
    sentences = [];
    currentSentenceIndex = 0;
    hasPlaybackPosition = false;
    lastStyledIndex = -1;

    renderEmptyState();
    updateSentenceStyles();
    updatePlayerUI();

    newSentences.forEach(sentence => pendingOutputSentences.push(sentence));
    processPendingOutputSentences();
    resetBtn.disabled = false;
    scheduleUserStateSave();

    const undoAction = previousSentences.length > 0 ? {
        label: getTranslation('undoClearButton', 'Undo'),
        onAction: () => {
            outputImportGeneration += 1;
            const fragment = document.createDocumentFragment();
            previousSentences.forEach(sentenceText => {
                fragment.appendChild(createSentenceElement(sentenceText));
            });
            lyricsTrack.innerHTML = '';
            lyricsTrack.appendChild(fragment);

            updateSentences();
            currentSentenceIndex = Math.min(previousIndex, sentences.length);
            hasPlaybackPosition = previousHasPosition;

            renderEmptyState();
            updateSentenceStyles();
            centerCurrentSentence(false, true);
            updatePlayerUI();
            resetBtn.disabled = sentences.length === 0;
            scheduleUserStateSave();
            showNotification(getTranslation('contentRestoredNotification'));
        }
    } : null;

    showNotification(message, 'success', undoAction, 8000);
    return true;
}

/* =========================================================
   files: read, RTF stripping, import
   ========================================================= */
const SUPPORTED_FILE_PATTERN = /\.(txt|md|markdown|rtf|tex|latex|log|nfo)$/i;
const PRESERVE_WHITESPACE_PATTERN = /\.(log|nfo)$/i;

function stripRtf(raw) {
    const source = String(raw || '');
    try {
        if (!/^\s*\{\\rtf/i.test(source)) {
            return source;
        }

        let text = source;
        text = text.replace(/\{\\\*\\generator[^{}]*\}/g, '');
        text = text.replace(/\\'([0-9a-fA-F]{2})/g, (match, hex) => String.fromCharCode(parseInt(hex, 16)));
        text = text.replace(/\\u(-?\d+)\s*\??/g, (match, code) => {
            const value = Number(code);
            return String.fromCharCode(value < 0 ? value + 65536 : value);
        });
        text = text.replace(/\\(par|line|sect|page)\b[ ]?/g, '\n');
        text = text.replace(/\\tab\b[ ]?/g, '\t');
        text = text.replace(/\\[a-zA-Z]+-?\d*[ ]?/g, '');
        text = text.replace(/[{}]/g, '');
        text = text.replace(/\\\\/g, '\\');
        text = text.replace(/\\(?=[{}\\])/g, '');
        text = text.replace(/\n{3,}/g, '\n\n');

        const stripped = text.trim();
        return stripped || source;
    } catch (error) {
        console.warn('RTF stripping failed, keeping raw text:', error);
        return source;
    }
}

async function readFiles(fileList) {
    const files = Array.from(fileList || []);
    const supported = files.filter(file => SUPPORTED_FILE_PATTERN.test(file.name));
    const parts = [];
    let preserveWhitespace = supported.length > 0;

    for (const file of supported) {
        let text = await file.text();
        if (/\.rtf$/i.test(file.name)) {
            text = stripRtf(text);
        }
        if (!PRESERVE_WHITESPACE_PATTERN.test(file.name)) {
            preserveWhitespace = false;
        }
        parts.push(text);
    }

    return {
        text: parts.join('\n\n'),
        accepted: supported.length,
        rejected: files.length - supported.length,
        preserveWhitespace
    };
}

async function importFiles(fileList) {
    const files = Array.from(fileList || []);

    if (files.length === 0) {
        showNotification(getTranslation('noSupportedFilesError'), 'error');
        return;
    }

    try {
        const result = await readFiles(files);

        if (result.accepted === 0) {
            showNotification(getTranslation('unsupportedFileError'), 'error');
            return;
        }

        if (!result.text.trim()) {
            showNotification(getTranslation('emptyFileError'), 'error');
            return;
        }

        replaceContent(result.text, {
            message: t('fileReplacedNotification', { count: result.accepted }),
            preserveWhitespace: result.preserveWhitespace
        });
    } catch (error) {
        console.error('File import failed:', error);
        showNotification(getTranslation('fileReadError'), 'error');
    }
}

function trapModalFocus(event, modal, closeFn) {
    if (event.key === 'Escape') {
        event.preventDefault();
        closeFn();
        return;
    }

    if (event.key !== 'Tab') {
        return;
    }

    const focusableElements = Array.from(modal.querySelectorAll(
        'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
    )).filter(element => element.offsetParent !== null);

    if (focusableElements.length === 0) {
        event.preventDefault();
        return;
    }

    const firstElement = focusableElements[0];
    const lastElement = focusableElements[focusableElements.length - 1];

    if (event.shiftKey && document.activeElement === firstElement) {
        event.preventDefault();
        lastElement.focus();
    } else if (!event.shiftKey && document.activeElement === lastElement) {
        event.preventDefault();
        firstElement.focus();
    }
}

/* =========================================================
   view switching
   ========================================================= */
function switchView(name) {
    if (!['read', 'settings'].includes(name)) {
        return;
    }

    currentView = name;

    document.querySelectorAll('[data-view-panel]').forEach(panel => {
        panel.hidden = panel.dataset.viewPanel !== name;
    });

    document.querySelectorAll('.nav-item[data-view]').forEach(button => {
        const isActive = button.dataset.view === name;
        button.classList.toggle('is-active', isActive);
        if (isActive) {
            button.setAttribute('aria-current', 'page');
        } else {
            button.removeAttribute('aria-current');
        }
    });

    updateTopBar();
    closeAllPopovers();

    if (name === 'read') {
        requestAnimationFrame(() => centerCurrentSentence(false, true));
    } else if (name === 'settings') {
        renderVoiceList();
        renderLanguageList();
    }
}

// ---- keyboard ----
document.addEventListener('keydown', event => {
    if (isHelpModalOpen) {
        trapModalFocus(event, helpModal, closeHelpModal);
        return;
    }

    if (isTextModalOpen) {
        trapModalFocus(event, textModal, closeTextModal);
        return;
    }

    if (event.key === 'Escape') {
        if (activePopover) {
            event.preventDefault();
            closeAllPopovers(true);
        }
        return;
    }

    if (activePopover && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
        const target = event.target;
        const isTextEntry = target && target.closest && target.closest('input, textarea, select');
        const items = Array.from(activePopover.querySelectorAll('button:not([disabled])'))
            .filter(element => element.offsetParent !== null);

        if (!isTextEntry && items.length > 0) {
            event.preventDefault();
            const currentIndex = items.indexOf(document.activeElement);
            const step = event.key === 'ArrowDown' ? 1 : -1;
            const nextIndex = currentIndex === -1
                ? (step === 1 ? 0 : items.length - 1)
                : (currentIndex + step + items.length) % items.length;
            items[nextIndex].focus();
        }
        return;
    }

    if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) {
        return;
    }

    const target = event.target;
    if (target && target.closest && target.closest('input, textarea, select, button, a, [contenteditable="true"]')) {
        return;
    }

    if (event.code === 'Space' || event.key === ' ') {
        event.preventDefault();
        togglePlayback();
    } else if (event.key === 'ArrowLeft') {
        event.preventDefault();
        seekBySentenceOffset(-5);
    } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        seekBySentenceOffset(5);
    }
});

// ---- misc ----
window.addEventListener('beforeunload', saveUserStateNow);

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
        saveUserStateNow();
    }
});

window.addEventListener('resize', () => {
    if (resizeTimer) {
        clearTimeout(resizeTimer);
    }
    resizeTimer = setTimeout(() => {
        resizeTimer = null;
        if (currentView === 'read') {
            centerCurrentSentence(false, true);
        }
        if (activePopover) {
            positionPopover(activePopover, activePopoverTrigger);
        }
    }, 160);
});

/* =========================================================
   init
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => {
    buildLanguageOptions();

    const userLang = String(navigator.language || 'en').split('-')[0];
    const savedLanguageIsValid = Boolean(languages[savedUserState.language]);
    languageSelect.value = savedLanguageIsValid
        ? savedUserState.language
        : (languages[userLang] ? userLang : 'en');

    restoreUserInterfaceState();
    restoreOutputState();
    buildSpeedPresets();

    loadTranslations(languageSelect.value);
    initVoices();

    switchView('read');
    updatePlayerUI();

    requestAnimationFrame(() => centerCurrentSentence(false, true));

    setTimeout(() => {
        if (voices.length === 0) {
            loadVoices();
        }
    }, 900);
});
</script>
